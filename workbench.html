<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Рабочее место — Пять звёзд</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--red:#b3202a;--green:#1d6b4e;--gold:#c9a24a;--ink:#15191b;--paper:#fbf8f2;--line:#e4ded2;--muted:#6c706f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Onest,system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--ink);color:white;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header strong{letter-spacing:.06em}main{max-width:1200px;margin:0 auto;padding:24px 16px 64px}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 16px #15191b0a}.card h3{margin:0 0 8px;font-size:1.05rem}.card h4{margin:18px 0 8px}.btn{border:1px solid var(--red);border-radius:8px;background:var(--red);color:#fff;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer;margin:5px 5px 5px 0}.btn.secondary{background:#fff;color:var(--ink);border-color:#bdb7ac}.btn.green{background:var(--green);border-color:var(--green)}.btn:disabled{opacity:.55;cursor:wait}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #cfc8bc;border-radius:8px;font:inherit;background:#fff;color:var(--ink)}label{display:block;font-size:.9rem;font-weight:650;margin:10px 0 5px}.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px 12px}.status{display:inline-block;padding:3px 9px;border-radius:99px;background:#eee8dd;font-size:.84rem}.msg{padding:10px 12px;border-radius:8px;margin:12px 0;background:#eee8dd}.msg.error{background:#f8dfdf;color:#8d1b23}.msg.ok{background:#dcefe5;color:#14583c}.hidden{display:none!important}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0 14px}.items{font-size:.92rem;padding-left:20px}.items li{margin:5px 0}a{color:inherit}.request{border-left:4px solid var(--gold)}.order{border-left:4px solid var(--green)}.small{font-size:.9rem}.divider{height:1px;background:var(--line);margin:16px 0}@media(max-width:560px){header{padding:14px}main{padding:18px 12px 40px}.card{padding:14px}}
</style></head><body>
<header><div><strong>ПЯТЬ ЗВЁЗД</strong><div class="small" style="color:#d5d1c9">Рабочее место автосервиса</div></div><div class="row"><span id="identity" class="small">Не выполнен вход</span><button id="logout" class="btn secondary hidden" type="button">Выйти</button><a class="btn secondary" href="./index.html">На сайт</a></div></header>
<main><section id="login-card" class="card"><h2>Вход для администратора или мастера</h2><p class="muted">Используйте существующий аккаунт AUTOFiX. Роли здесь не создаются и не меняются.</p><form id="login-form"><label for="email">Электронная почта</label><input id="email" type="email" autocomplete="username" required><label for="password">Пароль</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><button class="btn" id="login-btn">Войти</button></form></section>
<div id="message" class="msg hidden" role="status" aria-live="polite"></div><section id="workspace" class="hidden"><div class="section-head"><div><h1 id="welcome" style="margin:0">Рабочее место</h1><p class="muted" style="margin:4px 0 0">Все изменения проходят через защищённые RPC Supabase.</p></div><button id="refresh" class="btn secondary">Обновить данные</button></div><section id="admin-requests-section"><div class="section-head"><h2 style="margin:0">Новые заявки</h2></div><div id="requests" class="grid"></div></section><div class="section-head"><h2 style="margin:0">Заказы в работе</h2></div><div id="orders" class="grid"></div></section></main>
<script>
(()=>{
const sb=window.supabase.createClient('https://hzzglbgrgcxwhvtumoax.supabase.co','sb_publishable_g0lr_8L1JciriuketB_GEA_-QpQSsjT');
const $=id=>document.getElementById(id);let currentUser=null,role=null,requests=[],orders=[],profiles=[],versions=[],items=[];
const orderLabels={accepted:'Заявка принята',diagnostics:'Диагностика',awaiting_approval:'Ожидает согласования',approved:'Смета согласована',in_repair:'В ремонте',completed:'Ремонт завершён',cancelled:'Отменён'};const estimateLabels={draft:'Черновик',sent:'Отправлена клиенту',approved:'Согласована',rejected:'Отклонена',superseded:'Заменена'};const rub=new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB'});const money=v=>v==null?'—':rub.format(Number(v)||0);const date=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleDateString('ru-RU')};const dt=v=>{if(!v)return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':d.toLocaleString('ru-RU')};const get=(o,keys,fb='—')=>{for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];return fb};const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=String(txt);return n};
function say(t,type=''){const m=$('message');m.textContent=t;m.className='msg'+(type?' '+type:'')}function clearSay(){$('message').className='msg hidden'}async function rpc(name,args){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}function btn(text,fn,cls=''){const b=el('button','btn'+(cls?' '+cls:''),text);b.type='button';b.addEventListener('click',async()=>{b.disabled=true;try{await fn()}catch(e){console.error(e);say(e.message||'Операция не выполнена','error')}finally{b.disabled=false}});return b}
async function loadProfile(user){const {data,error}=await sb.from('autofix_profiles').select('*').eq('user_id',user.id).single();if(error)throw error;role=data.role;if(!['admin','master'].includes(role))throw new Error('У этого аккаунта нет роли администратора или мастера.');$('identity').textContent=(user.email||'Аккаунт')+' · '+role;$('logout').classList.remove('hidden');$('login-card').classList.add('hidden');$('workspace').classList.remove('hidden');$('welcome').textContent=role==='admin'?'Панель администратора':'Рабочее место мастера';$('admin-requests-section').classList.toggle('hidden',role!=='admin')}
async function loadData(){clearSay();const [rr,oo]=await Promise.all([role==='admin'?sb.from('AUTOFiX').select('*').order('created_at',{ascending:false}).limit(100):Promise.resolve({data:[],error:null}),sb.from('autofix_repair_orders').select('*').order('updated_at',{ascending:false}).limit(100)]);if(rr.error)throw rr.error;if(oo.error)throw oo.error;requests=rr.data||[];orders=oo.data||[];const pr=role==='admin'?await sb.from('autofix_profiles').select('*').eq('role','master'):{data:[],error:null};if(pr.error)throw pr.error;profiles=pr.data||[];versions=[];items=[];if(orders.length){const vr=await sb.from('autofix_estimate_versions').select('*').in('order_id',orders.map(o=>o.id)).order('version_no',{ascending:false});if(vr.error)throw vr.error;versions=vr.data||[];if(versions.length){const ir=await sb.from('autofix_estimate_items').select('*').in('version_id',versions.map(v=>v.id)).order('created_at',{ascending:true});if(ir.error)throw ir.error;items=ir.data||[]}}render()}
function render(){const rr=$('requests');rr.replaceChildren();if(role==='admin'){const linked=new Set(orders.map(o=>o.request_id));const pending=requests.filter(r=>!linked.has(r.id));if(!pending.length)rr.append(el('p','muted','Новых заявок нет.'));pending.forEach(r=>{const c=el('article','card request');c.append(el('h3',[get(r,['car_brand'],'Автомобиль'),get(r,['car_model'],'')].filter(Boolean).join(' ')));c.append(el('p','small','Номер: '+get(r,['license_plate'])+' · '+get(r,['car_year'])+' г.'));c.append(el('p','small','Клиент: '+get(r,['name'])+' · '+get(r,['phone'])+' · '+get(r,['email'])));c.append(el('p','small','Услуга: '+get(r,['service'])+' · желаемая дата: '+date(get(r,['preferred_date'],null))));if(get(r,['description'],'')!=='')c.append(el('p','small','Описание: '+get(r,['description'],'')));c.append(el('p','muted small','Поступила: '+dt(r.created_at)));c.append(btn('Принять заявку',async()=>{await rpc('autofix_accept_request',{p_request_id:r.id});say('Заявка принята.');await loadData()}));rr.append(c)})}
const root=$('orders');root.replaceChildren();if(!orders.length){root.append(el('p','muted','Заказов пока нет.'));return}orders.forEach(o=>{const c=el('article','card order');const req=requests.find(r=>r.id===o.request_id);c.append(el('h3',null,req?[get(req,['car_brand'],'Автомобиль'),get(req,['car_model'],'')].filter(Boolean).join(' '):'Заказ '+String(o.id).slice(0,8)));c.append(el('p','small','Заказ: '+o.id));c.append(el('p','small','Статус: '+get(orderLabels,[o.status],o.status)));if(req)c.append(el('p','small','Госномер: '+get(req,['license_plate'])+' · '+get(req,['phone'])));const assigned=get(o,['assigned_master_id','master_id','assigned_to'],null);if(role==='admin'){const wrap=el('div');wrap.append(el('label',null,'Назначить мастера'));const sel=el('select');sel.append(new Option('Выберите мастера',''));profiles.forEach(p=>sel.append(new Option(get(p,['full_name'],'Мастер '+String(p.user_id).slice(0,8)),p.user_id)));if(assigned)sel.value=assigned;wrap.append(sel,btn('Сохранить мастера',async()=>{if(!sel.value)throw new Error('Выберите мастера.');await rpc('autofix_assign_master',{p_order_id:o.id,p_master_id:sel.value});say('Мастер назначен.');await loadData()},'secondary'));c.append(wrap)}
const ov=versions.filter(v=>v.order_id===o.id);const latest=ov[0];if(latest){c.append(el('h4',null,'Последняя смета · версия '+get(latest,['version_no'])));c.append(el('p','small','Статус: '+get(estimateLabels,[latest.status],latest.status)+' · сумма: '+money(latest.total_amount)));if(latest.diagnosis)c.append(el('p','small','Диагностика: '+latest.diagnosis));const ii=items.filter(i=>i.version_id===latest.id);if(ii.length){const ul=el('ul','items');ii.forEach(i=>ul.append(el('li',null,get(i,['name'])+' — '+money(i.line_total))));c.append(ul)}}else c.append(el('p','muted small','Смета ещё не создана.'));
if(role==='admin'||(role==='master'&&assigned===currentUser.id)){const det=el('details');det.append(el('summary',null,'Создать или продолжить смету'));const form=el('div');const diag=el('textarea');diag.rows=2;diag.placeholder='Диагноз / выявленная неисправность';const rec=el('textarea');rec.rows=2;rec.placeholder='Рекомендации клиенту';const due=el('input');due.type='date';form.append(el('label',null,'Диагностика'),diag,el('label',null,'Рекомендации'),rec,el('label',null,'Плановая дата завершения'),due);const draft=latest&&latest.status==='draft'?latest:null;if(!draft)form.append(btn('Создать черновик сметы',async()=>{await rpc('autofix_new_estimate_version',{p_order_id:o.id,p_diagnosis:diag.value.trim()||null,p_recommendations:rec.value.trim()||null,p_planned_completion_date:due.value||null});say('Черновик сметы создан.');await loadData()}));else form.append(el('p','small','Черновик №'+draft.version_no+' уже создан. Добавьте позиции ниже.'));
const type=el('select');type.append(new Option('Запчасть','part'),new Option('Работа','labor'));const name=el('input');name.placeholder='Название запчасти или работы';const qty=el('input');qty.type='number';qty.min='0.001';qty.step='0.001';qty.value='1';const price=el('input');price.type='number';price.min='0';price.step='0.01';price.placeholder='Цена за единицу, ₽';form.append(el('h4',null,'Добавить позицию сметы'),el('label',null,'Тип'),type,el('label',null,'Наименование'),name);const two=el('div','field-grid'),qw=el('div'),pw=el('div');qw.append(el('label',null,'Количество'),qty);pw.append(el('label',null,'Цена за единицу'),price);two.append(qw,pw);form.append(two);if(draft){form.append(btn('Добавить позицию',async()=>{if(!name.value.trim()||Number(qty.value)<=0||Number(price.value)<0)throw new Error('Заполните название, количество и цену.');await rpc('autofix_add_estimate_item',{p_version_id:draft.id,p_item_type:type.value,p_name:name.value.trim(),p_quantity:Number(qty.value),p_unit_price:Number(price.value)});say('Позиция добавлена.');await loadData()},'secondary'));form.append(btn('Отправить смету клиенту',async()=>{if(!items.some(i=>i.version_id===draft.id))throw new Error('Добавьте хотя бы одну позицию сметы.');await rpc('autofix_send_estimate',{p_version_id:draft.id});say('Смета отправлена клиенту на согласование.');await loadData()},'green'))}c.append(form,det)}
if((role==='admin'||assigned===currentUser.id)&&o.status==='approved')c.append(btn('Начать ремонт',async()=>{await rpc('autofix_start_repair',{p_order_id:o.id});say('Ремонт начат.');await loadData()}));if((role==='admin'||assigned===currentUser.id)&&o.status==='in_repair')c.append(btn('Завершить ремонт',async()=>{await rpc('autofix_complete_order',{p_order_id:o.id});say('Ремонт завершён.');await loadData()},'green'));root.append(c)})}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();clearSay();$('login-btn').disabled=true;try{const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;currentUser=data.user;await loadProfile(currentUser);await loadData()}catch(err){say(err.message==='Invalid login credentials'?'Неверная почта или пароль.':err.message||'Вход не выполнен.','error')}finally{$('login-btn').disabled=false}});$('logout').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});$('refresh').addEventListener('click',async()=>{try{await loadData();say('Данные обновлены.','ok')}catch(e){say(e.message||'Ошибка обновления.','error')}});sb.auth.getSession().then(async({data,error})=>{if(error)throw error;if(data.session?.user){currentUser=data.session.user;await loadProfile(currentUser);await loadData()}}).catch(e=>say(e.message||'Не удалось восстановить сессию.','error'));
})();
</script></body></html>
